name: R8 guard

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r8-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r8-guard:
    name: R8 anti-regressao (ZipExtraField)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: "Build release minificado (sem keystore, usa a debug)"
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Anti-regressao R8 (ZipExtraField)
        run: |
          python3 tools/check-r8-zipextrafield.py \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload do mapping (diagnostico)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
