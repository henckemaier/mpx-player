name: CI

# Build + testes a cada push/PR.
# - Job `android`: compila o APK debug e roda os testes unitários (Linux, barato).
# - Job `ios`: compila e TESTA o alvo iOS num runner macOS (Kotlin/Native só gera
#   binários Apple em macOS). Valida o lado Kotlin do porte sem Mac local.
# O workflow de release (release.yml) é separado e só roda no push à main.

on:
  push:
    branches: [ main, 'feat/**', 'spike/**' ]
  pull_request:
  workflow_dispatch:

# Cancela runs superados do mesmo ref (economiza minutos macOS em pushes rápidos).
# Obs: um push num branch com PR aberto ainda dispara push E pull_request (refs
# distintos) — aceitável; estreite para só `pull_request` se quiser zerar isso.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (com cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug + testes unitários
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug test --no-daemon

  ios:
    name: iOS (compila + testa no simulador)
    # Runner macOS p/ o lado Apple do porte (ver PORTING-IOS.md §6, Risco 1 — RESOLVIDO).
    # Historia: macos-14 foi APOSENTADA pelo GitHub e o Xcode 15.4 saiu de todos os
    # runners hospedados, derrubando o pin fixo antigo. Hoje usamos macos-15 + Xcode
    # 'latest-stable' (pin abaixo). EMPÍRICO: o Kotlin/Native 2.0.21 (INALTERADO) linka/
    # cinteropa e roda os testes no simulador mesmo com Xcode 26.x — ao contrário do que
    # §6 supunha; o KGP só emite um WARNING benigno. Subir o Kotlin (Rota B) só vira
    # necessário se um Xcode futuro quebrar de fato a toolchain.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 'latest-stable' é INTENCIONAL (pin policy decidida — ver PORTING-IOS.md §6): o pin
      # fixo antigo (15.4) foi aposentado dos runners e quebrou o CI; latest-stable é
      # auto-curável contra essa rotação de imagem. O Kotlin/Native 2.0.21 tolera o Xcode
      # atual (hoje 26.x) só com um WARNING do KGP (não falha). Se um Xcode futuro quebrar
      # de fato o link/cinterop, o job falha explícito — e ISSO é o gatilho da Rota B
      # (subir o Kotlin). Pin major.minor explícito foi rejeitado (frágil a aposentadoria).
      - name: Fixa a versão do Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # O :shared aplica com.android.library, então o Gradle CONFIGURA o plugin
      # Android mesmo rodando só as tasks iOS — e isso exige ANDROID_HOME +
      # platform-35 + build-tools + licença aceita. As imagens macOS do GitHub
      # vêm com os componentes Android reduzidos, então instalamos explicitamente
      # (senão o job quebra na configuração, antes de qualquer task iOS).
      - name: Set up Android SDK (para configurar o :shared)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle (com cache)
        uses: gradle/actions/setup-gradle@v5

      # A distribuição do Kotlin/Native (~/.konan) é grande; sem cache cada run
      # baixa centenas de MB. Chave atrelada ao catálogo (muda com a versão do Kotlin).
      - name: Cache do Kotlin/Native (~/.konan)
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # O runner macOS é Apple Silicon (arm64): testar em iosSimulatorArm64 (não
      # iosX64, que exigiria Rosetta). iosSimulatorArm64Test compila o commonTest
      # para o simulador E roda os testes num simulador bootado — já exercita o
      # simulador, não só linka o framework. Em seguida monta o XCFramework.
      - name: Testa no simulador arm64 + monta XCFramework
        run: |
          chmod +x gradlew
          ./gradlew :shared:iosSimulatorArm64Test :shared:assembleSharedDebugXCFramework --no-daemon

      # TODO(quando existir iosApp/): validar o HOST SwiftUI + render do Compose
      # Multiplatform com xcodebuild + boot de simulador (compilar o framework não
      # prova que o app roda). Algo como:
      #   xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
      #     -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15' build

  ios-spike:
    name: iOS spike (linka Compose MP)
    # SPIKE CMP — Fase 1: PROVA que o Compose Multiplatform 1.7.1 LINKA o alvo
    # iosSimulatorArm64 com Kotlin 2.0.21 (sem bump). Mesmo runner/toolchain do job `ios`.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fixa a versão do Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Set up Android SDK (p/ configurar os módulos Android do spike)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle (com cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Cache do Kotlin/Native (~/.konan)
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # PROVADOR do link iOS do Compose MP: linka o framework do :composeAppSpike p/ o
      # simulador arm64. Verde aqui = CMP 1.7.1 linka com Kotlin 2.0.21 + Xcode atual.
      - name: Linka o framework iosSimulatorArm64 do spike
        run: |
          chmod +x gradlew
          ./gradlew :composeAppSpike:linkDebugFrameworkIosSimulatorArm64 --no-daemon
